{{ range .AllTranslations }}
<link rel="alternate" hreflang="{{ .Language.Lang }}" href="{{ .Permalink }}">
{{ if eq .Language.Lang "zh" }}
<link rel="alternate" hreflang="x-default" href="{{ .Permalink }}">
{{ end }}
{{ end }}
{{- $pages := dict -}}
{{- range .AllTranslations -}}
  {{- $pages = merge $pages (dict .Language.Lang .RelPermalink) -}}
{{- end -}}
{{- $data := dict "current" .Site.Language.Lang "isHome" .IsHome "pages" $pages -}}
<script type="application/json" id="hn-i18n">{{ $data | jsonify | safeJS }}</script>
<script>
(function () {
  var KEY = "hn-daily-lang";
  var SOURCE_KEY = "hn-daily-lang-source";

  window.__setLang = function (lang) {
    if (lang !== "zh" && lang !== "en") return;
    try {
      localStorage.setItem(KEY, lang);
      localStorage.setItem(SOURCE_KEY, "manual");
    } catch (e) {}
  };

  document.addEventListener("click", function (event) {
    var link = event.target && event.target.closest ? event.target.closest("[data-set-lang]") : null;
    if (!link) return;
    var lang = link.getAttribute("data-set-lang");
    window.__setLang(lang);
  }, true);

  var node = document.getElementById("hn-i18n");
  if (!node) return;
  var data;
  try { data = JSON.parse(node.textContent); } catch (e) { return; }
  var current = data.current;
  var pages = data.pages || {};
  var stored = null;
  var source = null;
  try {
    stored = localStorage.getItem(KEY);
    source = localStorage.getItem(SOURCE_KEY);
  } catch (e) {}

  function detect() {
    var langs = navigator.languages && navigator.languages.length
      ? navigator.languages
      : [navigator.language || navigator.userLanguage || ""];
    for (var i = 0; i < langs.length; i++) {
      var code = String(langs[i] || "").toLowerCase().split("-")[0];
      if (code === "zh" || code === "en") return code;
    }
    return "zh";
  }

  function go(lang) {
    if (!lang || lang === current || !pages[lang]) return;
    location.replace(pages[lang]);
  }

  // Priority 1: Manual selection (Highest priority)
  if (source === "manual" && (stored === "zh" || stored === "en")) {
    go(stored);
    return;
  }

  // Priority 2: Auto-detect (Lower priority, homepage only, no manual choice)
  if (!data.isHome) return;

  var preferred = detect();
  try {
    localStorage.setItem(KEY, preferred);
    localStorage.setItem(SOURCE_KEY, "auto");
  } catch (e) {}
  go(preferred);
})();
</script>
